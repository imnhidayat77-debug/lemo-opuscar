<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pencil Test — style frame</title>
<style>
@font-face { font-family: 'Caveat'; src: url(fonts/Caveat.ttf); font-weight: 400 700; font-display: block; }
@font-face { font-family: 'Courier Prime'; src: url(fonts/CourierPrime-Regular.ttf); font-display: block; }
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { render, DUR } from './frame.js';
const cv = document.getElementById('c'), W = innerWidth, H = innerHeight; cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
window.DUR = DUR;
window.render = t => render(ctx, W, H, t);
await Promise.all([document.fonts.load('600 40px Caveat'), document.fonts.load('22px "Courier Prime"')]);
window.READY = true;
</script></body></html>
